name: Transmisión EN VIVO Kraugé (κραυγή Live Engine)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duración del Live en minutos (ej. 1, 15, 60, 180)"
        required: false
        default: "1"
      inject_comment:
        description: "Comentario inicial en vivo para responder (ej. @viajero: Kraugé, léeme Salmos 23:4)"
        required: false
        default: "@viajero_del_desierto: Kraugé, hoy siento incertidumbre por el mañana, ¿qué dice la Palabra?"
      rtmp_url:
        description: "URL RTMP/RTMPS completa (Facebook / YouTube / IG). Déjala vacía si activas auto_facebook_live."
        required: false
        default: ""
      auto_youtube_live:
        description: "Crear evento YouTube Live 100% automático vía API (true/false)"
        required: false
        default: "false"
      auto_facebook_live:
        description: "Crear evento Facebook Live automáticamente vía Graph API (true/false)"
        required: false
        default: "false"
      use_local_gguf:
        description: "Descargar cerebro LLM Lite (Qwen2.5-1.5B GGUF) dentro del runner (0 APIs)"
        required: false
        default: "true"
      fb_live_id:
        description: "ID del Live de Facebook para leer comentarios en vivo (opcional)"
        required: false
        default: ""
      yt_live_id:
        description: "ID del Live de YouTube para leer comentarios en vivo (opcional)"
        required: false
        default: ""

jobs:
  krauge-live-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Cerebro Local Lite (Qwen2.5-1.5B GGUF en CPU del Runner)
        if: ${{ github.event.inputs.use_local_gguf == 'true' }}
        run: |
          pip install llama-cpp-python --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "Aviso: wheel precompilado no disponible; usando motor híbrido"
          mkdir -p models
          curl -L -s -o models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" || true
          ls -lh models/ || true

      - name: Iniciar Motor Kraugé EN VIVO (24 FPS + Consultas Bíblicas en Vivo + RTMP)
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          KRAUGE_RTMP_URL: ${{ github.event.inputs.rtmp_url || secrets.KRAUGE_RTMP_URL }}
          KRAUGE_LIVE_MINUTES: ${{ github.event.inputs.duration_minutes || '1' }}
          FB_LIVE_VIDEO_ID: ${{ github.event.inputs.fb_live_id }}
          YT_LIVE_VIDEO_ID: ${{ github.event.inputs.yt_live_id }}
          INJECT_COMMENT_ENV: ${{ github.event.inputs.inject_comment }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.auto_youtube_live }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --yt-auto-create"
          fi
          if [ "${{ github.event.inputs.auto_facebook_live }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --fb-auto-create"
          fi
          python -u krauge_live.py --duration "${{ github.event.inputs.duration_minutes || '1' }}" --inject-comment "$INJECT_COMMENT_ENV" $EXTRA_FLAGS

      - name: Subir Grabación del Live (Respaldo MP4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krauge-live-recording-${{ github.run_number }}
          path: out/krauge_live_demo.mp4
          if-no-files-found: ignore
          retention-days: 3
